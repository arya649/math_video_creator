<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engine Catalogue</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0c10; --panel: #15171d; --line: #2a2d36; --ink: #e8e8ea; --dim: #9a9ca5; --accent: #ffd84d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Poppins, system-ui, sans-serif; }
    header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: var(--dim); }
    input[type=search] { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; min-width: 240px; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 0; }
    nav a { color: var(--dim); text-decoration: none; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
    section { padding: 8px 16px 24px; }
    h2 { font-size: 15px; margin: 18px 0 10px; color: var(--accent); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .card canvas { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; cursor: pointer; }
    .card .meta { padding: 8px 10px 10px; }
    .card .id { font-family: ui-monospace, Menlo, monospace; color: var(--accent); font-size: 13px; }
    .card .title { color: var(--dim); font-size: 13px; }
    .card pre { margin: 6px 0 0; font-size: 11.5px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; color: #cfd2da; background: #0f1015; padding: 6px 8px; border-radius: 4px; max-height: 140px; overflow: auto; }
    .card .err { color: #ff8a7a; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Catalogue</h1>
    <span style="color: var(--dim)">Every option the engine draws, with the words to write for it. Click a picture to play it.</span>
    <input id="search" type="search" placeholder="Search IDs and names" />
    <a href="index.html" style="margin-left:auto">Engine</a>
  </header>
  <nav id="nav"></nav>
  <main id="list"></main>
  <script type="module" src="/src/catalog/main.ts"></script>
</body>
</html>
